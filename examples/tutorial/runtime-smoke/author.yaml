version: 1.0

use:
  profiles:
    - registry
    - fasthep_carpenter:registry
    - fasthep_curator:registry
    - fasthep_curator:default_context
    - fasthep_curator:runtime_diagnostics
    - fasthep_render:registry
    - fasthep_workshop:registry

data:
  datasets: []
  defaults:
    eventtype: mc
    tree_primary: events

sources:
  events:
    kind: workshop.toy_source
    nevents: 10000
    seed: 42
    dataset: runtime-smoke
    event_type: mc
    stream_type: event_stream

observers:
  - kind: hep.schema_snapshot
    at: [read.events, stage.DefinePt]
    out: schema

styles:
  pt_plot:
    op: hep.render.hist1d
    figure: {dpi: 120}
    axes:
      x: {name: leading_muon_pt, label: "Leading muon pT", limits: [0, 120]}
      y: {name: events, label: Events}
    style:
      experiment: FAST-HEP

analysis:
  stages:
    - id: DefinePt
      op: hep.define
      params:
        variables:
          - {name: leading_muon_pt, expr: "leading(sqrt(Muon_Px**2 + Muon_Py**2))"}

    - id: PtHist
      op: hep.hist
      from: DefinePt
      params:
        axes:
          - {name: leading_muon_pt, type: regular, source: leading_muon_pt, bins: {low: 0, high: 120, nbins: 12}}
      render:
        style: pt_plot
        when: final
        out: pt_hist
