version: 1.0

use:
  profiles:
    - hep_debug

data:
  defaults:
    eventtype: mc
    tree_primary: events

  datasets:
    - name: data
      eventtype: data
      nevents: "469384"
      files: [data/CMS/Zmumu/data.root]

    - name: dy
      nevents: "77729"
      files: [data/CMS/Zmumu/dy.root]

    - name: qcd
      nevents: "142"
      files: [data/CMS/Zmumu/qcd.root]

    - name: single_top
      nevents: "5684"
      files: [data/CMS/Zmumu/single_top.root]

    - name: ttbar
      nevents: "36941"
      files: [data/CMS/Zmumu/ttbar.root]

    - name: wjets
      nevents: "109737"
      files: [data/CMS/Zmumu/wjets.root]

    - name: ww
      nevents: "4580"
      files: [data/CMS/Zmumu/ww.root]

    - name: wz
      nevents: "3367"
      files: [data/CMS/Zmumu/wz.root]

    - name: zz
      nevents: "2421"
      files: [data/CMS/Zmumu/zz.root]

sources:
  events:
    kind: root_tree
    tree: events
    stream_type: event_stream
    branches:
      - EventWeight
      - Muon_Px
      - Muon_Py
      - Muon_Pz
      - Muon_E
      - Muon_Iso

analysis:
  stages:
    - id: BasicVars
      op: hep.define
      params:
        variables:
          - name: Muon_Pt
            expr: "sqrt(Muon_Px ** 2 + Muon_Py ** 2)"
          - name: IsoMuon_Idx
            expr: "(Muon_Iso / Muon_Pt) < 0.10"

    - id: DiMuons
      op: hep.di_object_mass
      params:
        collection: Muon
        mask: IsoMuon_Idx

    - id: DiMuonMass
      op: hep.hist
      params:
        dataset_axis: true
        storage: weighted
        axes:
          - name: dimu_mass
            source: DiMuon_Mass
            type: regular
            bins:
              low: 60
              high: 120
              nbins: 60
        weight_expr: EventWeight
      render:
        style: dimuon_mass
        when: final

styles:
  base_counts_data_mc:
    op: hep.render.data_mc
    figure:
      size: [12, 12]
      dpi: 300

    axes:
      ratio:
        name: ratio
        label: Data/MC
        limits: [0.5, 1.5]

    legend:
      loc: upper right
      ncol: 3

    style:
      experiment: CMS
      datasets:
        data: {label: "Data", color: black, kind: data}
        dy: {label: "DY", color: yellow, kind: signal}
        ttbar: {label: "$t\\bar{t}$", color: red, kind: background}
        wjets: {label: "W+jets", color: blue, kind: background}
        single_top: {label: "Single top", color: green, kind: background}
        qcd: {label: "QCD", color: orange, kind: background}
        ww: {label: "WW", color: cyan, kind: background}
        wz: {label: "WZ", color: magenta, kind: background}
        zz: {label: "ZZ", color: gray, kind: background}

    data_mc:
      data: data
      signals: [dy]
      backgrounds: [qcd, single_top, ttbar, wjets, ww, wz, zz]
      stack: true
      ratio: true
      histtype_mc: fill
      show_mc_uncertainty: true

  dimuon_mass:
    use: base_counts_data_mc
    with:
      axes:
        x:
          name: dimu_mass
          label: "Di-muon Mass, $M_{\\mu\\mu}$ [GeV/c$^{2}]$"
          limits: [60, 120]

        y:
          name: events
          label: Events
          scale: log
          limits: [1e-2, 1e5]
