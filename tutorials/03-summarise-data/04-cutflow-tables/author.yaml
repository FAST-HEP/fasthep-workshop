version: 1.0

include:
  - datasets.yaml
  - styles.yaml

use:
  profiles:
    - registry
    - fasthep_carpenter:registry
    - fasthep_curator:registry
    - fasthep_curator:default_context
    - fasthep_curator:runtime_diagnostics
    - fasthep_render:registry
    - fasthep_workshop:registry

data:
  defaults:
    eventtype: mc
    tree_primary: events

sources:
  events:
    kind: root_tree
    tree: events
    stream_type: event_stream
    branches:
      - EventWeight
      - NMuon
      - Muon_Px
      - Muon_Py
      - Muon_Iso
      - triggerIsoMu24

analysis:
  stages:
    - id: MuonObjectFlags
      op: hep.define
      params:
        variables:
          - {name: Muon_Pt, expr: "sqrt(Muon_Px ** 2 + Muon_Py ** 2)"}
          - {name: IsolatedMuon, expr: "(Muon_Iso / Muon_Pt) < 0.10"}
          - {name: NIsolatedMuon, reduce: {op: count_nonzero, over: IsolatedMuon}}
          - {name: HasMuonAbove25, reduce: {op: any, over: "Muon_Pt > 25"}}

    - id: SelectDimuonEvents
      op: hep.selection.cutflow
      params:
        selection:
          dimuon_candidates:
            - "NIsolatedMuon >= 2"
            - "triggerIsoMu24 == 1"
            - "HasMuonAbove25"
        weight_expr: EventWeight
      render:
        style: event_selection_cutflow
        when: final
        out: SelectDimuonEvents.csv
