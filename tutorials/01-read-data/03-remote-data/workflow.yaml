version: 1.0

include:
  - datasets.yaml

use:
  profiles:
    - hep_debug

data:
  defaults:
    eventtype: data
    tree_primary: Events

sources:
  events:
    kind: root_tree
    tree: Events
    stream_type: event_stream
    start: 0
    stop: 1000

observers:
  - kind: hep.schema_snapshot
    at: [read.events]
    out: schema
