version: 1.0

include:
  - datasets.yaml

use:
  profiles:
    - registry
    - fasthep_carpenter:registry
    - fasthep_curator:registry
    - fasthep_curator:default_context
    - fasthep_curator:runtime_diagnostics
    - fasthep_workshop:registry

data:
  defaults:
    tree_primary: events

sources:
  events:
    kind: root_tree
    tree: events
    stream_type: event_stream
    branches:
      - triggerIsoMu24
    start: 0
    stop: 1000

observers:
  - kind: hep.schema_snapshot
    at: [read.events, stage.TriggerSelection]
    out: schema

fields:
  analysis_trigger: {stream: events, branch: "triggerIsoMu24"}

analysis:
  stages:
    - id: TriggerSelection
      op: hep.selection.cutflow
      params:
        selection:
          All:
            - "analysis_trigger == 1"
