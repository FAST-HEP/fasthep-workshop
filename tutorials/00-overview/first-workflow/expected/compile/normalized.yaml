version: '1.0'
data:
  defaults:
    eventtype: mc
    tree_primary: events
  datasets:
  - name: toy
    files:
    - toy://dy
    nevents: '100000'
    eventtype: mc
    group: toy
    meta: {}
sources:
  events:
    kind: workshop.toy_source
    stream_type: event_stream
    nevents: 100000
    seed: 1729
    dataset: toy
    eventtype: mc
    weight: 1.0
joins: {}
styles:
  muon_pt:
    op: hep.render.hist1d
    figure:
      size:
      - 8
      - 6
      dpi: 150
    axes:
      x:
        name: Muon_Pt
        label: Muon $p_T$ [GeV]
        limits:
        - 0
        - 120
      y:
        name: events
        label: Events
        scale: linear
fields: {}
observers: []
analysis:
  stages:
  - id: BasicVars
    op: hep.define
    params:
      variables:
      - name: Muon_Pt
        expr: sqrt(Muon_Px ** 2 + Muon_Py ** 2)
  - id: MuonPt
    op: hep.hist
    params:
      axes:
      - name: Muon_Pt
        source: Muon_Pt
        type: regular
        bins:
          low: 0
          high: 120
          nbins: 60
    render:
      style: muon_pt
      when: final
      out: MuonPt.png
primary_stream: null
use:
  profiles:
  - registry
  - fasthep_carpenter:registry
  - fasthep_render:registry
  - fasthep_workshop:registry
execution:
  backend: local
  strategy: default
  config: {}
registry:
  functions:
    sqrt: numpy:sqrt
    abs: numpy:abs
    log: numpy:log
    log10: numpy:log10
    exp: numpy:exp
    where: numpy:where
    fill_none: awkward:fill_none
    pad_none: awkward:pad_none
    nth: fasthep_carpenter.expr_helpers:nth
    leading: fasthep_carpenter.expr_helpers:leading
    subleading: fasthep_carpenter.expr_helpers:subleading
  constants: {}
  ops: {}
  renderers:
    hep.render.hist1d:
      spec: fasthep_render.types.hist1d:HIST1D_RENDER_TYPE
      impl: fasthep_render.impl.hist1d:render_hist1d
    hep.render.data_mc:
      spec: fasthep_render.types.data_mc:DATA_MC_RENDER_TYPE
      impl: fasthep_render.impl.data_mc:render_data_mc
    hep.render.heatmap2d:
      spec: fasthep_render.types.heatmap2d:HEATMAP2D_RENDER_TYPE
      impl: fasthep_render.impl.heatmap2d:render_heatmap2d
    hep.render.project:
      spec: fasthep_render.types.project:PROJECT_RENDER_TYPE
      impl: fasthep_render.impl.project:render_project_then
    hep.render.comparison:
      spec: fasthep_render.types.comparison:COMPARISON_RENDER_TYPE
      impl: fasthep_render.impl.comparison:render_comparison
  sinks:
    root_tree:
      spec: fasthep_carpenter.spec.write.root_tree:ROOT_TREE_WRITE_SPEC
      impl: fasthep_carpenter.impl.write.root_tree:run_root_tree_write
    hep.render.hist1d:
      spec: fasthep_render.spec.sinks.hist1d:HIST1D_RENDER_SPEC
      impl: fasthep_render.impl.sinks.hist1d:run_hist1d_render
    hep.render.data_mc:
      spec: fasthep_render.spec.sinks.data_mc:DATA_MC_RENDER_SPEC
      impl: fasthep_render.impl.sinks.data_mc:run_data_mc_render
    hep.render.heatmap2d:
      spec: fasthep_render.spec.sinks.heatmap2d:HEATMAP2D_RENDER_SPEC
      impl: fasthep_render.impl.sinks.heatmap2d:run_heatmap2d_render
    hep.render.project:
      spec: fasthep_render.spec.sinks.project:PROJECT_RENDER_SPEC
      impl: fasthep_render.impl.sinks.project:run_project_render
    hep.render.comparison:
      spec: fasthep_render.spec.sinks.comparison:COMPARISON_RENDER_SPEC
      impl: fasthep_render.impl.sinks.comparison:run_comparison_render
  sources:
    root_tree:
      spec: fasthep_carpenter.spec.read.root_tree:ROOT_TREE_SOURCE_SPEC
      impl: fasthep_carpenter.impl.read.root_tree:run_root_tree_source
    workshop.toy_source:
      spec: fasthep_workshop.sources.toy_source:TOY_SOURCE_SPEC
      impl: fasthep_workshop.sources.toy_source:run_toy_source
  observers: {}
  transforms:
    hep.project_fields:
      spec: fasthep_carpenter.spec.project_fields:PROJECT_FIELDS_SPEC
      impl: fasthep_carpenter.impl.project_fields:run_project_fields
    hep.zip_join:
      spec: fasthep_carpenter.spec.zip_join:ZIP_JOIN_SPEC
      impl: fasthep_carpenter.impl.zip_join:run_zip_join
    hep.define:
      spec: fasthep_carpenter.spec.define_transform:DEFINE_TRANSFORM_SPEC
      impl: fasthep_carpenter.impl.define:run_define_transform
    hep.selection.cutflow:
      spec: fasthep_carpenter.spec.cutflow_transform:CUTFLOW_TRANSFORM_SPEC
      impl: fasthep_carpenter.impl.cutflow:run_cutflow_transform
    hep.hist:
      spec: fasthep_carpenter.spec.hist_transform:HIST_TRANSFORM_SPEC
      impl: fasthep_carpenter.impl.make_hist:run_hist_transform
    hep.di_object_mass:
      spec: fasthep_carpenter.spec.di_object_mass_transform:DI_OBJECT_MASS_TRANSFORM_SPEC
      impl: fasthep_carpenter.impl.di_object_mass:run_di_object_mass_transform
    cms.match_l1t_jets:
      spec: fasthep_carpenter.spec.cms.match_l1t_jets_transform:CMS_MATCH_L1T_JETS_TRANSFORM_SPEC
      impl: fasthep_carpenter.impl.cms.match_l1t_jets:run_match_l1t_jets_transform
  backends:
    local.default:
      impl: hepflow.backends.local:LocalBackend
    dask.local:
      impl: hepflow.backends.dask_local:DaskLocalBackend
  hooks: {}
execution_hooks: []
