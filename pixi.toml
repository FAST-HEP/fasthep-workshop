[workspace]
name = "fasthep-workshop"
authors = ["FAST-HEP contributors"]
channels = ["conda-forge"]
platforms = ["linux-64"]
version = "0.1.0"

[dependencies]
python = ">=3.11"
pip = "*"
python-build = "*"
hatchling = "*"
hatch-vcs = "*"
pytest = "*"
ruff = "*"
mypy = "*"
pre-commit = "*"
codespell = "*"
twine = "*"

[environments]
default = ["released"]
docs = ["docs"]
dev = ["dev"]

[feature.released.pypi-dependencies]
fasthep-flow = ">=2026.06.1"
fasthep-carpenter = ">=2026.06.1"
fasthep-curator = ">=2026.06.1"
fasthep-render = ">=2026.06.1"
fasthep-toolbench = ">=2026.06.1"
fasthep-cli = ">=2026.06.1"
fasthep-workshop = { path = ".", editable = true }

[feature.dev.pypi-dependencies]
fasthep-flow = { path = "../flow", editable = true }
fasthep-carpenter = { path = "../carpenter", editable = true }
fasthep-curator = { path = "../curator", editable = true }
fasthep-render = { path = "../render", editable = true }
fasthep-cli = { path = "../cli", editable = true }

[feature.docs.dependencies]
python = ">=3.11"
sphinx = "*"
myst-parser = "*"
pydata-sphinx-theme = "*"
sphinx-copybutton = "*"
sphinx-design = "*"
sphinxcontrib-mermaid = "*"

[feature.docs.pypi-dependencies]
fasthep-workshop = { path = ".", editable = true }

[tasks]
format = "ruff format src tests"
lint = "ruff check src tests"
lint-fix = "ruff check --fix src tests"
typecheck = "mypy src tests"
test = "pytest"
build = "python -m build"
check = { depends-on = ["lint", "typecheck", "test"] }
ci = { depends-on = ["check", "build"] }
check-dist = "twine check dist/*"
docs = "sphinx-build -b html docs docs/_build/html"
docs-clean = "rm -rf docs/_build"
