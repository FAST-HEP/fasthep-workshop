[workspace]
name = "fasthep-workshop"
authors = ["FAST-HEP contributors"]
channels = ["conda-forge"]
platforms = ["linux-64"]
version = "0.1.0"

[dependencies]
python = ">=3.11"
pytest = "*"
ruff = "*"
mypy = "*"

[pypi-dependencies]
fasthep-workshop = { path = ".", editable = true }
fasthep-flow = ">=2026.06.1"
fasthep-carpenter = ">=2026.06.1"
fasthep-curator = ">=2026.06.1"
fasthep-render = ">=2026.06.1"
fasthep-toolbench = ">=2026.06.1"
fasthep-cli = ">=2026.06.1"
# fasthep-flow = { path = "../fasthep-flow", editable = true }
# fasthep-carpenter = { path = "../fasthep-carpenter", editable = true }
# fasthep-curator = { path = "../fasthep-curator", editable = true }
# fasthep-render = { path = "../fasthep-render", editable = true }
# fasthep-cli = { path = "../fasthep-cli", editable = true }


[feature.docs.dependencies]
python = ">=3.11"
sphinx = "*"
myst-parser = "*"
pydata-sphinx-theme = "*"
sphinx-copybutton = "*"
sphinx-design = "*"
sphinxcontrib-mermaid = "*"

[feature.docs.pypi-dependencies]
fasthep-workshop = { path = ".", editable = true }

[environments]
default = ["default"]
docs = ["docs"]

[tasks]
lint = "ruff check src tests"
lint-fix = "ruff check --fix src tests"
typecheck = "mypy src tests"
test = "pytest"
ci = { depends-on = ["lint", "typecheck", "test"] }

[tasks.docs]
cmd = "sphinx-build -b html docs docs/_build/html"

[tasks.docs-clean]
cmd = "rm -rf docs/_build"
